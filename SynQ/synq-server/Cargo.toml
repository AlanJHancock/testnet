[package]
name = "synq-server"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = { workspace = true }
sha3 = { workspace = true }
axum        = { version = "0.7", features = ["json"] }
tokio       = { version = "1",   features = ["full"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
tower-http  = { version = "0.5", features = ["cors", "limit"] }
tower       = { version = "0.4" }
synq-compiler = { path = "../compiler" }
synq-vm       = { path = "../vm" }
hex  = { workspace = true }
ruint = { workspace = true }
# CSPRNG for session IDs — uses OS getrandom(2), no seed management needed
getrandom = "0.2"
