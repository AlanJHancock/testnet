[workspace]
resolver = "2"

[package]
name = "synq-compiler-wasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom    = { version = "0.3", features = ["wasm_js"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
hex          = "0.4"

# Needed by the vendored VM (vm_inner)
ruint        = "1"
sha3         = "0.10"

# Use the real compiler crate (WASM build — drops native PQC deps)
synq-compiler = { package = "synq-compiler", path = "../compiler", default-features = false, features = ["wasm"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
