[package]
name = "synq-vm"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native  = ["dep:pqc_shims", "pqc_shims/native", "dep:pqcrypto"]
wasm    = []

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }
ruint      = { workspace = true }
sha3       = { workspace = true }
sha2       = { workspace = true }

pqcrypto  = { workspace = true, optional = true }
pqc_shims = { package = "synq-pqc-shims", path = "../pqc-shims", default-features = false, optional = true }

[dev-dependencies]
synq-compiler = { path = "../compiler" }
