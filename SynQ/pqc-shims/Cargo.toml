[package]
name = "synq-pqc-shims"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native  = [
    "dep:pqcrypto",
    "dep:pqcrypto-traits",
    "dep:pqcrypto-mldsa",
    "dep:pqcrypto-falcon",
    "dep:pqcrypto-sphincsplus",
]
wasm = []

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }

pqcrypto          = { workspace = true, optional = true }
pqcrypto-traits   = { workspace = true, optional = true }
pqcrypto-mldsa    = { workspace = true, optional = true }
pqcrypto-falcon   = { workspace = true, optional = true }
pqcrypto-sphincsplus = { workspace = true, optional = true }
