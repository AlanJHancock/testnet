[workspace]
members = [
    "vm",
    "compiler",
    "cli",
    "pqc-shims",
    "synq-server",
]
resolver = "2"

[workspace.dependencies]
governor      = { version = "0.6", features = ["std"] }
dashmap       = "5"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
ruint = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
pqcrypto = "0.18"
pqcrypto-traits = "0.3"
pqcrypto-mldsa = "0.1"
pqcrypto-falcon = "0.4"
pqcrypto-sphincsplus = "0.7"
